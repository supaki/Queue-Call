<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Display</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Custom styles for very large text and high contrast */
        body {
            background-color: #1a202c; /* tailwind gray-900 */
            color: #f7fafc; /* tailwind gray-100 */
            overflow: hidden; /* Prevent scrollbars */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .calling-item {
            background-color: #4a5568; /* tailwind gray-700 */
            border: 2px solid #a0aec0; /* tailwind gray-500 */
            border-radius: 0.5rem;
            padding: 1.5rem; /* Increased padding */
            margin-bottom: 1rem;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .calling-queue-number {
            font-size: 6rem; /* Significantly larger */
            font-weight: bold;
            color: #63b3ed; /* tailwind blue-400 */
            line-height: 1;
        }
        .calling-channel-name {
            font-size: 2.5rem; /* Larger */
            color: #cbd5e0; /* tailwind gray-400 */
            margin-top: 0.5rem;
        }
        .waiting-item {
            font-size: 1.75rem; /* Larger */
            color: #e2e8f0; /* tailwind gray-300 */
            padding: 0.5rem 1rem;
            background-color: #2d3748; /* tailwind gray-800 */
            border-radius: 0.375rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        #youtubePlayer iframe {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen">

    <!-- Main Content Area (Queues) -->
    <div class="w-full md:w-3/5 p-4 md:p-8 flex flex-col">
        <h1 class="text-5xl font-bold text-center mb-6 text-blue-300">NOW SERVING</h1>
        <div id="callingArea" class="flex-grow space-y-2 overflow-y-auto">
            <!-- Calling items will be populated here -->
            <p class="text-center text-gray-400 text-2xl">Waiting for next call...</p>
        </div>

        <div class="mt-auto pt-4">
             <h2 class="text-3xl font-semibold text-center mb-3 text-blue-200">WAITING</h2>
            <div id="waitingListArea" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2">
                <!-- Waiting list items will be populated here -->
                <p class="text-center text-gray-500 text-xl col-span-full">Waiting list is empty.</p>
            </div>
        </div>
    </div>

    <!-- Multimedia Area -->
    <div id="multimediaArea" class="w-full md:w-2/5 h-1/3 md:h-full bg-black flex items-center justify-center">
        <div id="youtubePlayer" class="w-full h-full">
            <!-- YouTube player will be embedded here -->
            <div class="w-full h-full bg-black flex items-center justify-center text-gray-500">
                YouTube Player Loading...
            </div>
        </div>
    </div>

    <script>
        let activeDisplayPollingInterval = null;
        const POLLING_INTERVAL_MS = 5000; // 5 seconds
        const DEFAULT_YOUTUBE_VIDEO_ID = "dQw4w9WgXcQ"; // Default placeholder (Rick Astley)
        let previousCallingQueueIds = new Set();

        // DOM Elements
        const callingArea = document.getElementById('callingArea');
        const waitingListArea = document.getElementById('waitingListArea');
        const youtubePlayerDiv = document.getElementById('youtubePlayer');

        function initializeDisplay() {
            fetchDisplayData();
            activeDisplayPollingInterval = setInterval(fetchDisplayData, POLLING_INTERVAL_MS);
            loadYoutubePlayer(DEFAULT_YOUTUBE_VIDEO_ID); // Load default video
        }

        function fetchDisplayData() {
            google.script.run
                .withSuccessHandler(processDisplayData)
                .withFailureHandler(onFailure)
                .getCurrentlyCallingAndWaitingQueuesForAllChannels(); // From display.gs
        }

        function processDisplayData(response) {
            if (response && response.success) {
                updateCallingDisplay(response.data.calling || []);
                updateWaitingListDisplay(response.data.waiting || []);
            } else {
                console.error("Failed to fetch display data:", response.message);
                // Optionally show a subtle error on screen, but keep trying
            }
        }

        function updateCallingDisplay(callingQueues) {
            callingArea.innerHTML = ''; // Clear previous
            const currentCallingQueueIds = new Set();

            if (!callingQueues || callingQueues.length === 0) {
                const p = document.createElement('p');
                p.className = 'text-center text-gray-400 text-2xl';
                p.textContent = 'Waiting for next call...';
                callingArea.appendChild(p);
                previousCallingQueueIds.clear(); // Reset if nothing is calling
                return;
            }
            
            // Sort by timestampCalled to ensure newest are potentially highlighted or first
            // The backend already sorts, but an additional client sort can be a failsafe
            callingQueues.sort((a, b) => new Date(b.timestampCalled) - new Date(a.timestampCalled));

            callingQueues.forEach(queue => {
                const item = document.createElement('div');
                item.className = 'calling-item animate-pulse'; // Added pulse for new items initially
                
                const queueNumberEl = document.createElement('div');
                queueNumberEl.className = 'calling-queue-number';
                queueNumberEl.textContent = queue.queueNumber;
                
                const channelNameEl = document.createElement('div');
                channelNameEl.className = 'calling-channel-name';
                channelNameEl.textContent = queue.channelName;
                
                item.appendChild(queueNumberEl);
                item.appendChild(channelNameEl);
                callingArea.appendChild(item);

                currentCallingQueueIds.add(queue.queueId); // Use queueId for tracking

                // TODO: When a new queue number appears in 'callingQueues' compared to the previous fetch, trigger a sound.
                if (!previousCallingQueueIds.has(queue.queueId)) {
                    console.log("New queue called:", queue.queueNumber, "at", queue.channelName, "(ID:", queue.queueId,") - Trigger sound!");
                    // Example: playSound();
                    // Remove pulse after a bit
                    setTimeout(() => item.classList.remove('animate-pulse'), 3000);
                }
            });
            previousCallingQueueIds = currentCallingQueueIds;
        }

        function updateWaitingListDisplay(waitingQueues) {
            waitingListArea.innerHTML = ''; // Clear previous
            if (!waitingQueues || waitingQueues.length === 0) {
                const p = document.createElement('p');
                p.className = 'text-center text-gray-500 text-xl col-span-full';
                p.textContent = 'Waiting list is empty.';
                waitingListArea.appendChild(p);
                return;
            }

            waitingQueues.forEach(queue => {
                const item = document.createElement('div');
                item.className = 'waiting-item';
                item.textContent = `${queue.queueNumber} (${queue.channelName.substring(0,3)})`; // Shorten channel name if needed
                waitingListArea.appendChild(item);
            });
        }

        function loadYoutubePlayer(youtubeVideoId) {
            if (!youtubeVideoId) {
                youtubePlayerDiv.innerHTML = '<div class="w-full h-full bg-black flex items-center justify-center text-gray-500">No video configured.</div>';
                return;
            }
            const embedUrl = `https://www.youtube.com/embed/${youtubeVideoId}?autoplay=1&mute=1&loop=1&playlist=${youtubeVideoId}&controls=0&modestbranding=1&showinfo=0&rel=0`;
            
            const iframe = document.createElement('iframe');
            iframe.setAttribute('src', embedUrl);
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allow', 'autoplay; encrypted-media');
            iframe.setAttribute('allowfullscreen', 'true');
            
            youtubePlayerDiv.innerHTML = ''; // Clear placeholder
            youtubePlayerDiv.appendChild(iframe);
        }

        function onFailure(error) {
            console.error('GAS Call Error:', error);
            // Display a subtle error message on screen, or simply log it and retry
            // For a public display, avoid breaking the entire screen.
            // Example: if (callingArea.innerHTML === '') callingArea.innerHTML = "<p class='text-red-400 text-center'>Error loading data. Retrying...</p>";
        }

        // Event Listeners
        window.addEventListener('load', initializeDisplay);
        window.addEventListener('beforeunload', () => {
            if (activeDisplayPollingInterval) {
                clearInterval(activeDisplayPollingInterval);
            }
        });

    </script>
</body>
</html>
