<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Display</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Custom styles for very large text and high contrast */
        body {
            background-color: #1a202c; /* tailwind gray-900 */
            color: #f7fafc; /* tailwind gray-100 */
            overflow: hidden; /* Prevent scrollbars */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .calling-item {
            background-color: #4a5568; /* tailwind gray-700 */
            border: 2px solid #a0aec0; /* tailwind gray-500 */
            border-radius: 0.5rem;
            padding: 1.5rem; /* Increased padding */
            margin-bottom: 1rem;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .calling-queue-number {
            font-size: 6rem; /* Significantly larger */
            font-weight: bold;
            color: #63b3ed; /* tailwind blue-400 */
            line-height: 1;
        }
        .calling-channel-name {
            font-size: 2.5rem; /* Larger */
            color: #cbd5e0; /* tailwind gray-400 */
            margin-top: 0.5rem;
        }
        .waiting-item {
            font-size: 1.75rem; /* Larger */
            color: #e2e8f0; /* tailwind gray-300 */
            padding: 0.5rem 1rem;
            background-color: #2d3748; /* tailwind gray-800 */
            border-radius: 0.375rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        #youtubePlayer iframe {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen">

    <!-- Main Content Area (Queues Display) -->
    <div class="w-full md:w-3/5 p-4 md:p-8 flex flex-col">
        <h1 class="text-5xl font-bold text-center mb-6 text-blue-300">NOW SERVING</h1>
        <!-- Area for Currently Calling Queues -->
        <div id="callingArea" class="flex-grow space-y-2 overflow-y-auto">
            <!-- Calling queue items will be populated by JavaScript -->
            <p class="text-center text-gray-400 text-2xl">Waiting for next call...</p>
        </div>
        <!-- End Currently Calling Area -->

        <!-- Area for Waiting Queues List -->
        <div class="mt-auto pt-4">
             <h2 class="text-3xl font-semibold text-center mb-3 text-blue-200">WAITING</h2>
            <div id="waitingListArea" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2">
                <!-- Waiting list items will be populated by JavaScript -->
                <p class="text-center text-gray-500 text-xl col-span-full">Waiting list is empty.</p>
            </div>
        </div>
        <!-- End Waiting List Area -->
    </div>
    <!-- End Main Content Area -->

    <!-- Multimedia Area (e.g., YouTube Player) -->
    <div id="multimediaArea" class="w-full md:w-2/5 h-1/3 md:h-full bg-black flex items-center justify-center">
        <div id="youtubePlayer" class="w-full h-full">
            <!-- YouTube player iframe will be embedded here by JavaScript -->
            <div class="w-full h-full bg-black flex items-center justify-center text-gray-500">
                YouTube Player Loading...
            </div>
        </div>
    </div>
    <!-- End Multimedia Area -->

    <script>
        // --- Global Variables & Configuration ---
        let activeDisplayPollingInterval = null;    // Interval ID for data polling
        const POLLING_INTERVAL_MS = 5000;           // Data refresh interval (5 seconds)
        const DEFAULT_YOUTUBE_VIDEO_ID = "dQw4w9WgXcQ"; // Placeholder YouTube video (Rick Astley)
        let previouslyCallingQueueIds = new Set();  // Stores QueueIDs from the previous fetch to detect new calls
        
        // DOM Element References
        const callingArea = document.getElementById('callingArea');
        const waitingListArea = document.getElementById('waitingListArea');
        const youtubePlayerDiv = document.getElementById('youtubePlayer');

        // --- Audio Management Global Variables ---
        let soundSequenceQueue = []; // Holds URLs for the current announcement sequence
        let currentAudioPlayer = null; // The single <audio> element for playback
        let isPlayingSequence = false; // Flag to indicate if a sound sequence is currently playing
        
        let firstDataLoadComplete = false; // Flag to manage initial sound playing (for detecting *new* calls)

        // --- Initialization ---

        /**
         * Initializes the display screen on page load.
         * Sets up audio, fetches initial data, starts polling, and loads the YouTube player.
         */
        function initializeDisplay() {
            initializeAudioPlayer(); 
            fetchDisplayData(); // Fetch data for the first time
            activeDisplayPollingInterval = setInterval(fetchDisplayData, POLLING_INTERVAL_MS); // Start polling for updates
            loadYoutubePlayer(DEFAULT_YOUTUBE_VIDEO_ID); // Load default or configured YouTube video
        }

        /**
         * Initializes the Audio object for playing notification sounds.
         * Sets up event listeners for 'ended' (to play next sound) and 'error'.
         */
        function initializeAudioPlayer() {
            if (!currentAudioPlayer) {
                currentAudioPlayer = new Audio();
                currentAudioPlayer.preload = "auto"; // Preload for faster playback
                
                // Event listener for when a sound in the sequence finishes playing
                currentAudioPlayer.addEventListener('ended', playNextSoundInSequence);
                
                // Event listener for errors during audio playback
                currentAudioPlayer.addEventListener('error', handleAudioError);
                
                console.log("Audio player initialized.");
            }
        }

        // --- Data Fetching and Processing ---

        /**
         * Fetches queue data from the server-side `getCurrentlyCallingAndWaitingQueuesForAllChannels` function.
         */
        function fetchDisplayData() {
            google.script.run
                .withSuccessHandler(processDisplayData) // Process data on success
                .withFailureHandler(onFailure)           // Handle errors
                .getCurrentlyCallingAndWaitingQueuesForAllChannels(); // Server-side function in display.gs
        }

        /**
         * Processes the fetched queue data, updates the display, and triggers notification sounds for new calls.
         * @param {object} response The response object from the server.
         *                          Expected: { success: boolean, data?: { calling: Array<object>, waiting: Array<object> }, message?: string }
         */
        function processDisplayData(response) {
            if (response && response.success && response.data) {
                const currentCallingQueuesData = response.data.calling || [];
                const currentWaitingQueuesData = response.data.waiting || [];

                // --- Sound Notification Logic for Sequenced Audio ---
                const currentCallingMap = new Map(currentCallingQueuesData.map(q => [q.queueId, q]));
                const newlyCalledQueues = [];

                if (firstDataLoadComplete) {
                    currentCallingMap.forEach((queue, queueId) => {
                        if (!previouslyCallingQueueIds.has(queueId)) {
                            newlyCalledQueues.push(queue); // This queue is newly called
                        }
                    });
                } else {
                    firstDataLoadComplete = true; // First load, don't play sounds for existing calls
                }
                
                // If new calls are detected and no sequence is currently playing, start the first new one.
                if (newlyCalledQueues.length > 0 && !isPlayingSequence) {
                    let queueToAnnounce = newlyCalledQueues[0]; // Announce the first new one
                    
                    // The backend now provides 'soundUrlSequence' directly with the queue object
                    if (queueToAnnounce.soundUrlSequence && Array.isArray(queueToAnnounce.soundUrlSequence)) {
                        console.log("Preparing to play sound sequence for queue:", queueToAnnounce.queueNumber, queueToAnnounce.soundUrlSequence);
                        
                        // Filter out any potentially empty/null URLs and transform GDrive IDs
                        soundSequenceQueue = queueToAnnounce.soundUrlSequence.map(urlOrId => {
                            if (urlOrId && urlOrId.length > 20 && !urlOrId.startsWith('http')) { // Basic check for Drive ID
                                return `https://drive.google.com/uc?export=download&id=${urlOrId}`;
                            }
                            return urlOrId; 
                        }).filter(url => url && url.trim() !== ""); 

                        if (soundSequenceQueue.length > 0) {
                            isPlayingSequence = true;
                            playNextSoundInSequence();
                        } else {
                             console.log("Sound sequence for " + queueToAnnounce.queueNumber + " was empty after processing URLs.");
                        }
                    } else {
                        console.log("No soundUrlSequence found or it's not an array for newly called queue:", queueToAnnounce.queueNumber);
                    }
                }
                
                previouslyCallingQueueIds = new Set(currentCallingMap.keys()); // Update for next comparison
                // --- End Sound Notification Logic ---

                // Update UI with the fetched data.
                updateCallingDisplay(currentCallingQueuesData);
                updateWaitingListDisplay(currentWaitingQueuesData);

            } else {
                console.error("Failed to fetch display data or server returned an error:", response.message || "No message provided.");
            }
        }

        // --- UI Update Functions ---

        /**
         * Updates the "Currently Calling" section of the display.
         * @param {Array<object>} callingQueues An array of queue objects currently in the "calling" state.
         */
        function updateCallingDisplay(callingQueues) {
            callingArea.innerHTML = ''; 

            if (!callingQueues || callingQueues.length === 0) {
                const p = document.createElement('p');
                p.className = 'text-center text-gray-400 text-2xl';
                p.textContent = 'Waiting for next call...';
                callingArea.appendChild(p);
                return;
            }
            
            callingQueues.sort((a, b) => new Date(b.timestampCalled) - new Date(a.timestampCalled));

            callingQueues.forEach(queue => {
                const item = document.createElement('div');
                item.className = 'calling-item animate-pulse'; 
                
                const queueNumberEl = document.createElement('div');
                queueNumberEl.className = 'calling-queue-number';
                queueNumberEl.textContent = queue.queueNumber;
                
                const channelNameEl = document.createElement('div');
                channelNameEl.className = 'calling-channel-name';
                channelNameEl.textContent = queue.channelName;
                
                item.appendChild(queueNumberEl);
                item.appendChild(channelNameEl);
                callingArea.appendChild(item);

                setTimeout(() => item.classList.remove('animate-pulse'), 3000); 
            });
        }

        /**
         * Updates the "Waiting List" section of the display.
         * @param {Array<object>} waitingQueues An array of queue objects currently in the "waiting" state.
         */
        function updateWaitingListDisplay(waitingQueues) {
            waitingListArea.innerHTML = ''; 
            if (!waitingQueues || waitingQueues.length === 0) {
                const p = document.createElement('p');
                p.className = 'text-center text-gray-500 text-xl col-span-full';
                p.textContent = 'Waiting list is empty.';
                waitingListArea.appendChild(p);
                return;
            }

            waitingQueues.forEach(queue => {
                const item = document.createElement('div');
                item.className = 'waiting-item';
                item.textContent = `${queue.queueNumber} (${queue.channelName.substring(0,3)}...)`; 
                waitingListArea.appendChild(item);
            });
        }

        // --- Multimedia Player ---

        /**
         * Loads and configures the YouTube player with a given video ID.
         * @param {string} youtubeVideoId The ID of the YouTube video to embed.
         */
        function loadYoutubePlayer(youtubeVideoId) {
            if (!youtubeVideoId) {
                youtubePlayerDiv.innerHTML = '<div class="w-full h-full bg-black flex items-center justify-center text-gray-500">No YouTube video configured.</div>';
                return;
            }
            const embedUrl = `https://www.youtube.com/embed/${youtubeVideoId}?autoplay=1&mute=1&loop=1&playlist=${youtubeVideoId}&controls=0&modestbranding=1&showinfo=0&rel=0`;
            
            const iframe = document.createElement('iframe');
            iframe.setAttribute('src', embedUrl);
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allow', 'autoplay; encrypted-media'); 
            iframe.setAttribute('allowfullscreen', 'true');
            
            youtubePlayerDiv.innerHTML = ''; 
            youtubePlayerDiv.appendChild(iframe);
        }

        // --- Sound Playback Engine ---

        /**
         * Plays the next sound in the `soundSequenceQueue`.
         * This function is called when the current sound finishes (due to 'ended' event listener)
         * or when a new sequence is initiated.
         */
        function playNextSoundInSequence() {
            if (soundSequenceQueue.length > 0) {
                let nextSoundUrl = soundSequenceQueue.shift(); // Get and remove the first URL from the queue
                
                // URL construction for Google Drive files is now handled in processDisplayData before adding to queue
                if (nextSoundUrl && currentAudioPlayer) {
                    console.log("Playing sound:", nextSoundUrl);
                    currentAudioPlayer.src = nextSoundUrl;
                    currentAudioPlayer.play().catch(e => { 
                        console.error("Error playing sound:", nextSoundUrl, e);
                        handleAudioError(e); // Pass the error object
                    });
                } else if (nextSoundUrl === "" || !nextSoundUrl) { // If URL is empty, skip and play next
                    console.log("Skipping empty sound URL in sequence.");
                    playNextSoundInSequence(); 
                }
            } else {
                // No more sounds in the queue, sequence finished.
                isPlayingSequence = false;
                console.log("Sound sequence finished.");
            }
        }

        /**
         * Handles errors during audio playback.
         * Logs the error and stops the current sound sequence.
         * @param {Event|Error} error The error event or error object from the audio player.
         */
        function handleAudioError(error) {
            console.error("Audio playback error detected:", error);
            if (currentAudioPlayer && currentAudioPlayer.error) {
                console.error("Audio player error code:", currentAudioPlayer.error.code);
                console.error("Audio player error message:", currentAudioPlayer.error.message);
            }
            isPlayingSequence = false; // Stop trying to play this sequence
            soundSequenceQueue = [];   // Clear the problematic queue
        }


        // --- Error Handling and Event Listeners ---

        /**
         * Generic failure handler for `google.script.run` calls.
         * @param {Error} error The error object from the failed call.
         */
        function onFailure(error) {
            console.error('Google Apps Script Call Error:', error);
        }

        // Event Listeners
        window.addEventListener('load', initializeDisplay); 
        window.addEventListener('beforeunload', () => {
            if (activeDisplayPollingInterval) {
                clearInterval(activeDisplayPollingInterval);
            }
        });

    </script>
</body>
</html>
